<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm Animator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div>
        <h1>Algorithm Animator</h1>
        <p>Watch sorting algorithms work, one step at a time.</p>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle color theme" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="card">
        <h2 class="card-title">Algorithm</h2>
        <div class="algo-list" id="algo-list" role="radiogroup" aria-label="Sorting algorithm"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Settings</h2>
        <label class="field">
          <span class="field-head"><span>Array size</span><output id="size-out"></output></span>
          <input type="range" id="size" min="5" max="150" value="40">
        </label>
        <label class="field">
          <span class="field-head"><span>Speed</span><output id="speed-out"></output></span>
          <input type="range" id="speed" min="1" max="100" value="50">
        </label>
        <label class="field">
          <span class="field-head"><span>Input</span></span>
          <select id="pattern">
            <option value="random">Random</option>
            <option value="nearly">Nearly sorted</option>
            <option value="reversed">Reversed</option>
            <option value="few">Few unique</option>
          </select>
        </label>
      </section>

      <section class="card info">
        <h2 class="card-title" id="info-name"></h2>
        <p class="info-desc" id="info-desc"></p>
        <dl class="complexity">
          <div><dt>Best</dt><dd id="info-best"></dd></div>
          <div><dt>Average</dt><dd id="info-avg"></dd></div>
          <div><dt>Worst</dt><dd id="info-worst"></dd></div>
          <div><dt>Space</dt><dd id="info-space"></dd></div>
        </dl>
        <span class="badge" id="info-stable"></span>
      </section>
    </aside>

    <section class="stage-wrap">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Status</span>
          <span class="stat-value status" id="stat-status"><i></i><span>Ready</span></span>
        </div>
        <div class="stat">
          <span class="stat-label">Comparisons</span>
          <span class="stat-value" id="stat-comparisons">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Swaps</span>
          <span class="stat-value" id="stat-swaps">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Array writes</span>
          <span class="stat-value" id="stat-writes">0</span>
        </div>
      </div>

      <div class="card stage">
        <div class="visual" id="visual"></div>
        <div class="progress-row">
          <div class="progress"><div id="progress-bar"></div></div>
          <span class="progress-label" id="progress-label"></span>
        </div>
      </div>

      <div class="toolbar">
        <div class="legend">
          <span><i class="dot compare"></i>Comparing</span>
          <span><i class="dot swap"></i>Swapping / writing</span>
          <span><i class="dot pivot"></i>Pivot / minimum</span>
          <span><i class="dot sorted"></i>Sorted</span>
        </div>
        <div class="buttons">
          <button id="generate" class="btn" title="New array (N)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            New array
          </button>
          <button id="reset" class="btn" title="Reset (R)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            Reset
          </button>
          <button id="step" class="btn" title="Step (→)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 10 8-10 8z"/><path d="M19 5v14"/></svg>
            Step
          </button>
          <button id="play" class="btn primary" title="Play / pause (Space)">
            <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            <span id="play-label">Sort</span>
          </button>
        </div>
      </div>

      <p class="shortcuts">
        <kbd>Space</kbd> play / pause <kbd>→</kbd> step <kbd>R</kbd> reset <kbd>N</kbd> new array
      </p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
